<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WorkNeverEnd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 시작 화면 -->
  <section id="start-screen" class="start">
    <form id="start-form" class="start-card">
      <div class="start-brand"><span class="logo-mark">W</span><span>(주)워크네버엔드 그룹웨어</span></div>
      <h1>입사를 축하합니다</h1>
      <p class="lead">출근하면 업무함엔 요청이 쌓이고, 메신저는 쉬지 않고 울리고, 캘린더는 회의로 꽉 찹니다. 오늘도 일은 끝나지 않습니다.</p>
      <label class="field-label" for="player-name">이름</label>
      <input id="player-name" class="input" maxlength="10" placeholder="김신입" autocomplete="off">
      <span class="field-label">부서</span>
      <div class="job-list">
        <button class="job selected" data-job="기획" type="button"><strong>기획팀</strong><span>기획서, 보고서, 일정 조율</span></button>
        <button class="job" type="button" disabled><strong>개발팀</strong><span>준비 중</span></button>
        <button class="job" type="button" disabled><strong>디자인팀</strong><span>준비 중</span></button>
        <button class="job" type="button" disabled><strong>영업팀</strong><span>준비 중</span></button>
      </div>
      <div class="start-actions">
        <button class="btn primary" type="submit">첫 출근하기</button>
        <button id="btn-continue" class="btn" type="button" hidden>이어서 출근하기</button>
      </div>
    </form>
  </section>

  <!-- 게임 화면 -->
  <section id="game-screen" class="game" hidden>
    <header class="gw-header">
      <div class="gw-top">
        <div class="brand"><span class="logo-mark">W</span><span class="brand-name">WorkNeverEnd</span></div>
        <div class="when">
          <span id="day-label" class="day"></span>
          <span id="clock" class="clock">09:00</span>
          <span id="phase-label" class="phase" hidden></span>
        </div>
      </div>
      <nav id="nav" class="gw-nav" aria-label="메뉴"></nav>
    </header>

    <div class="gw-body">
      <aside id="sidebar" class="sidebar"></aside>
      <main id="main" class="main"></main>
      <aside id="messenger" class="messenger" aria-label="사내 메신저"></aside>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="modal" class="modal">
    <div id="modal-body"></div>
  </dialog>

  <script src="js/data/people.js"></script>
  <script src="js/data/terms.js"></script>
  <script src="js/data/tasks.js"></script>
  <script src="js/data/messages.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/core.js"></script>
  <script src="js/generators.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/messenger.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
